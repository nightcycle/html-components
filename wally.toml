[package]
name = "nightcycle/html-components"
description = "Strict React Luau HTML components with contextual CSS and native Roblox UI."
version = "0.1.0"
authors = ["CJ Oyer <coyer@nightcycle.us>"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
license = "Apache-2.0"
include = [
  "src", "src/init.luau", "src/Types.luau", "src/Catalog.luau", "src/Tag.luau", "src/Children.luau",
  "src/CSS", "src/CSS/**",
  "src/React", "src/React/Context", "src/React/Context/**",
  "src/React/Hook", "src/React/Hook/**", "src/React/Render", "src/React/Render/**",
  "src/React/Component", "src/React/Component/*/init.luau",
  # Component folders (maintained by scripts/generate.luau).
  "src/React/Component/{A,Abbr,Address,Article,Aside,B,Blockquote,Body,Br,Button,Cite,Code,Dd,Del,Div,Dl,Dt,Em,Fieldset,Figcaption,Figure,Footer,Form,H1,H2,H3,H4,H5,H6,Header,Hr,Html,I,Img,Input,Ins,Kbd,Label,Legend,Li,Main,Mark,Meter,Nav,Ol,Output,P,Pre,Progress,Q,S,Samp,Section,Small,Span,Strong,StyleProvider,Textarea,Time,U,Ul,Var,Video}",
  "docs", "docs/**", "default.project.json", "wally.toml", "README.md", "LICENSE",
]
exclude = ["**"]

[place]
shared-packages = "game.ReplicatedStorage.Packages"

[dependencies]
React = "jsdotlua/react@17.2.1"
RobloxComponents = "nightcycle/typed-instance-components@^0.1.1"

[dev-dependencies]
ReactRoblox = "jsdotlua/react-roblox@17.2.1"
UILabs = "pepeeltoro41/ui-labs@2.4.2"
